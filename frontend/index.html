<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuickGig — find short-term local gigs or post one in minutes." />
    <title>QuickGig — Short-term gigs, nearby</title>
    <script>
      // Pre-paint theme: dark users never see a light flash.
      // ?light=1 / ?dark=1 force a mode — escape hatch if a stale mode is stuck.
      try {
        var q = new URLSearchParams(location.search)
        var forced = q.get('light') === '1' ? 'light' : q.get('dark') === '1' ? 'dark' : null
        var m = forced || localStorage.getItem('quickgig_theme')
        if (m === 'dark') {
          document.documentElement.dataset.mode = 'dark'
        } else {
          document.documentElement.dataset.mode = 'light'
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23217A44'/%3E%3Cpath d='M17.5 6 9 18h5.5L14 26l8.5-12H17z' fill='%23FAFBF9'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
